<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neverness to Everness (NTE) | The Next Gen Anime Open-World RPG</title>
    <meta name="description" content="Imagine GTA… But Anime. Drive through a living city, uncover supernatural chaos, and experience the next generation of anime open-world games. Play on PC now!">
    <meta name="keywords" content="Neverness to Everness, NTE, Perfect World Games, Anime GTA, Supernatural RPG, Anime Open World, Play on PC, Urban Sandbox">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nte.perfectworld.com/">
    <meta property="og:title" content="Neverness to Everness (NTE) | Anime Open-World RPG">
    <meta property="og:description" content="Imagine GTA… But Anime. Drive through a living city, uncover supernatural chaos, and experience the next generation of anime open-world games.">
    <meta property="og:image" content="logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://nte.perfectworld.com/">
    <meta property="twitter:title" content="Neverness to Everness (NTE) | Anime Open-World RPG">
    <meta property="twitter:description" content="Imagine GTA… But Anime. Drive through a living city, uncover supernatural chaos, and experience the next generation of anime open-world games.">
    <meta property="twitter:image" content="logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Interactive Custom Cursor -->
    <div class="custom-cursor"></div>
    <div class="custom-cursor-dot"></div>

    <!-- Full Screen Background Video -->
    <div class="video-container">
        <video id="bg-video" autoplay muted loop playsinline>
            <source src="NTE_video_trimmed.mp4" type="video/mp4">
            <!-- Fallback to original if trimmed not found/still processing -->
            <source src="NTE_video.mp4" type="video/mp4">
        </video>
        <!-- Dark Vignette Overlay to blend video into the absolute black background -->
        <div class="vignette-overlay"></div>
    </div>

    <!-- Glassmorphic Header Navbar -->
    <header class="header">
        <div class="header-logo">
            <a href="https://nte.perfectworld.com/" target="_blank" aria-label="Neverness to Everness Home">
                <img src="logo.png" alt="Neverness to Everness Logo" id="nte-logo">
            </a>
        </div>
        <div class="header-actions">
            <a href="https://nte.perfectworld.com/" target="_blank" class="btn-download-header" id="btn-download-header">
                Download Now
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <section class="hero-section">
            <div class="hero-text-container">


                <!-- BIG HOOK -->
                <div class="hook-wrapper">
                    <h2 class="big-hook">
                        IMAGINE GTA…
                        <br>
                        BUT ANIME.
                    </h2>
                </div>

                <!-- Description -->
                <p class="small-description">
                    Drive through a living city, uncover supernatural chaos, and experience the next generation of anime open-world games.
                </p>

                <!-- Call To Actions -->
                <div class="cta-actions-container">
                    <!-- Primary CTA with user colors -->
                    <div class="cta-primary-wrapper">
                        <a href="https://nte.perfectworld.com/" target="_blank" class="btn-cta-primary" id="btn-play-pc">
                            <span class="btn-bg-glow"></span>
                            <span class="btn-content">
                                <svg class="play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                PLAY ON PC
                            </span>
                        </a>
                        <span class="cta-subtext">Windows Only</span>
                    </div>
                    
                    <!-- Secondary Link for Launching Trailer -->
                    <a href="https://www.youtube.com/watch?v=Rwb4SjpjR2A" target="_blank" class="btn-cta-secondary" id="btn-launch-trailer">
                        <svg class="trailer-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
                        </svg>
                        Launch Official Trailer
                    </a>
                </div>
            </div>
        </section>

        <!-- Interactive Right Promo Video Player ("Red Squad") -->
        <div class="promo-video-container" id="promo-video-container">
            <div class="video-player-wrapper">
                <video id="promo-video" poster="slide1.jpg" preload="metadata" loop playsinline>
                    <source src="promo_video.mp4" type="video/mp4">
                </video>
                
                <!-- Play Button Overlay -->
                <div class="video-overlay-play">
                    <div class="play-btn-circle">
                        <svg class="play-svg" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                    <span class="play-btn-text">PLAY PREVIEW</span>
                </div>
            </div>
            <!-- Glassmorphic Decorative HUD footer for the player -->
            <div class="video-hud-footer">
                <span class="hud-recording-dot"></span>
                <span class="hud-live-label">LIVE PREVIEW FEED // SECURE_016_023</span>
            </div>
        </div>

        <!-- Bottom Right Official Launch Banner -->
        <a href="https://nte.perfectworld.com/" target="_blank" class="bottom-right-banner" id="bottom-right-banner" aria-label="NTE 04/29 Official Launch Details">
            <img src="nav_transparent.png" alt="Neverness to Everness 04/29 Official Launch Banner">
        </a>


    </main>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
